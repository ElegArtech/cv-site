name: Validation du site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Vérifier les nœuds, les arêtes et les liens
        run: python scripts/check-site.py
